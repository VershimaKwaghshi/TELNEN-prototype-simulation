<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TELNEN Simulation</title>
<style>
  :root {
    --bg: #0b0b0c;
    --panel: #151517;
    --border: #2a2a2d;
    --text: #f2f2f2;
    --dim: #9a9a9e;
    --accent: #ffffff;
    --good: #4ade80;
    --bad: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0;
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    letter-spacing: 1px;
  }
  header h1 span { color: var(--dim); font-weight: 400; }
  .clock {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: var(--dim);
  }
  .clock b { color: var(--text); }
  button {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
  }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  nav {
    display: flex;
    gap: 4px;
    padding: 12px 24px 0 24px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  nav button {
    background: transparent;
    color: var(--dim);
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 10px 12px;
    font-weight: 500;
  }
  nav button.active {
    color: var(--text);
    border-bottom: 2px solid var(--text);
  }
  main {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
    padding: 20px 24px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 15px;
    margin: 0 0 4px 0;
  }
  .panel p.desc {
    color: var(--dim);
    font-size: 13px;
    margin: 0 0 14px 0;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .label { color: var(--dim); }
  .stat-row .value { font-weight: 600; }
  .good { color: var(--good); }
  .bad { color: var(--bad); }
  .warn { color: var(--warn); }
  .manager-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .manager-card.selected { border-color: var(--accent); }
  .manager-card .info { font-size: 13px; }
  .manager-card .region { color: var(--dim); font-size: 12px; }
  .log {
    background: #000;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    height: 420px;
    overflow-y: auto;
    font-size: 12.5px;
    line-height: 1.6;
  }
  .log .entry { padding: 4px 0; border-bottom: 1px solid #1c1c1e; }
  .log .entry:last-child { border-bottom: none; }
  .log .day-tag { color: var(--dim); margin-right: 6px; }
  .bar-bg {
    background: #000;
    border: 1px solid var(--border);
    border-radius: 6px;
    height: 10px;
    overflow: hidden;
    margin: 6px 0 2px 0;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
  }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  th { color: var(--dim); font-weight: 500; }
  input[type=number], input[type=range] {
    background: #000;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 6px;
    width: 100%;
  }
  .row-inline { display: flex; gap: 8px; align-items: center; }
  .tag {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--dim);
  }
  .tag.active { color: var(--good); border-color: var(--good); }
  .tag.danger { color: var(--bad); border-color: var(--bad); }
  .hidden { display: none; }
</style>
</head>
<body>

<header>
  <h1>TELNEN <span>simulation prototype</span></h1>
  <div class="clock">
    Day <b id="dayCount">0</b>
    <button onclick="advanceDay(1)">Advance 1 day</button>
    <button class="secondary" onclick="advanceDay(10)">Advance 10 days</button>
    <button class="secondary" onclick="resetSim()">Reset</button>
  </div>
</header>

<nav id="tabs"></nav>

<main>
  <div id="content"></div>
  <div class="panel" style="height: fit-content;">
    <h2>Event log</h2>
    <p class="desc">Everything the simulation does, narrated day by day.</p>
    <div class="log" id="logBox"></div>
  </div>
</main>

<script>
// ---------- CONFIG, the actual TE rules ----------
const REGIONS = ["West Africa", "South Asia", "Southeast Asia", "Europe", "North America"];
const ALIASES = ["Falcon", "Kestrel", "Harrier", "Osprey", "Merlin", "Kite", "Peregrine", "Buzzard", "Condor", "Raven"];

function randomManager() {
  const region = REGIONS[Math.floor(Math.random() * REGIONS.length)];
  const alias = ALIASES[Math.floor(Math.random() * ALIASES.length)] + "-" + Math.floor(100 + Math.random() * 900);
  return { alias, region, id: alias };
}

function todaysThreeManagers() {
  const regions = [...REGIONS].sort(() => Math.random() - 0.5).slice(0, 3);
  return regions.map(r => {
    const m = randomManager();
    m.region = r;
    return m;
  });
}

// ---------- STATE ----------
let state = null;

function freshState() {
  return {
    day: 0,
    log: [],
    account: {
      hasAccount: false,
      manager: null,
      fundedValue: 0,
      balance: 0,
      history: [],
    },
    capitalBuilding: {
      active: false,
      target: 10000,
      paidSoFar: 0,
      day: 0,
      funded: false,
      locked: false,
      defaulted: false,
    },
    restitution: {
      inQueue: false,
      queuePosition: 0,
      claimAmount: 0,
      recoveredSoFar: 0,
      daysInQueue: 0,
    },
    socialBond: {
      active: false,
      amount: 0,
      lienDaysLeft: 0,
      facilitatorCovered: 0,
      bonderCovered: 0,
    },
    referral: {
      hasReferral: true,
      referrerId: "TP-10432",
      referrerInactiveDays: 0,
      marketplaceEligible: false,
    },
    incomeStreams: {
      managedPersonal: 0,
      subManagerSpread: 0,
      directManagement: 0,
      assignedAccounts: 0,
      subManagerCut: 0,
      facilitatorYield: 0,
      bonderYield: 0,
      referralOverride: 0,
      capitalBuildingMaturity: 0,
    },
    todaysManagerOptions: [],
  };
}

function log(text, cls) {
  state.log.push({ day: state.day, text, cls: cls || "" });
}

// ---------- CORE ACTIONS ----------

function startAccount() {
  if (state.account.hasAccount) return;
  state.account.hasAccount = true;
  state.account.fundedValue = 1000;
  state.account.balance = 1000;
  log("Personal deposit of $1,000 received. Account is active and needs a manager.", "");
  rollTodaysManagers();
  render();
}

function rollTodaysManagers() {
  state.todaysManagerOptions = todaysThreeManagers();
}

function pickManager(id) {
  const m = state.todaysManagerOptions.find(x => x.id === id);
  if (!m) return;
  state.account.manager = m;
  log(`Manager ${m.alias} from ${m.region} assigned. Rotating alias, identity hidden both ways.`, "");
  render();
}

function startCapitalBuilding(target) {
  state.capitalBuilding.active = true;
  state.capitalBuilding.target = target;
  state.capitalBuilding.paidSoFar = 0;
  state.capitalBuilding.day = 0;
  state.capitalBuilding.funded = false;
  state.capitalBuilding.locked = false;
  state.capitalBuilding.defaulted = false;
  log(`Capital Building started. Target account size $${target.toLocaleString()}, scheduled daily payment $${(target*0.011).toFixed(2)}.`, "");
  render();
}

function requestSocialBond() {
  const loss = state.account.fundedValue - state.account.balance;
  if (loss <= 0) { log("No qualifying loss to bond against right now.", "warn"); render(); return; }
  state.socialBond.active = true;
  state.socialBond.amount = loss;
  state.socialBond.lienDaysLeft = 30;
  state.socialBond.facilitatorCovered = Math.random() < 0.5 ? loss * 0.5 : loss;
  state.socialBond.bonderCovered = state.socialBond.facilitatorCovered < loss ? loss - state.socialBond.facilitatorCovered : 0;
  state.account.balance = state.account.fundedValue;
  const fee = loss * 0.20;
  log(`Social Bond requested for $${loss.toFixed(2)}. Facilitator covered $${state.socialBond.facilitatorCovered.toFixed(2)}${state.socialBond.bonderCovered > 0 ? ", bonders covered the remaining $" + state.socialBond.bonderCovered.toFixed(2) : ""}. Account restored to $${state.account.fundedValue.toFixed(2)} immediately. Activation fee $${fee.toFixed(2)}, split 40 percent facilitator, 40 percent bonders, 20 percent TE.`, "good");
  render();
}

function joinReferralMarketplace(retainPct) {
  state.referral.marketplaceEligible = false;
  state.referral.referrerInactiveDays = 0;
  state.referral.referrerId = "TP-" + Math.floor(10000 + Math.random() * 89999);
  log(`Moved to a new referrer through the Referral Marketplace. You retained ${retainPct} percent, new referrer receives ${15 - retainPct} percent.`, "");
  render();
}

// ---------- DAILY SIMULATION ----------

function advanceDay(n) {
  for (let i = 0; i < n; i++) {
    doOneDay();
  }
  render();
}

function doOneDay() {
  state.day++;

  // Capital Building tick
  const cb = state.capitalBuilding;
  if (cb.active && !cb.funded && !cb.locked) {
    const scheduled = cb.target * 0.011;
    cb.paidSoFar += scheduled;
    cb.day++;
    const feePortion = cb.target * 0.001;
    log(`Capital Building day ${cb.day}. Scheduled payment $${scheduled.toFixed(2)} made, of which $${feePortion.toFixed(2)} is TE's service fee. Paid so far $${cb.paidSoFar.toFixed(2)} of $${cb.target.toLocaleString()}.`, "");

    if (cb.day >= 11 && !cb.funded && Math.random() < 0.15) {
      cb.funded = true;
      state.account.hasAccount = true;
      state.account.fundedValue = cb.target;
      state.account.balance = cb.target;
      log(`Early funding triggered on day ${cb.day}. TE had sufficient available funds and funded the full $${cb.target.toLocaleString()} account ahead of schedule.`, "good");
      rollTodaysManagers();
    }

    if (cb.day >= 100 && !cb.funded) {
      cb.funded = true;
      state.account.hasAccount = true;
      state.account.fundedValue = cb.target;
      state.account.balance = cb.target;
      log(`Day 100 reached. Scheduled payments cover the full target, account funded at $${cb.target.toLocaleString()}, guaranteed by completing the schedule.`, "good");
      rollTodaysManagers();
    }
  }

  // Trading tick
  const acc = state.account;
  if (acc.hasAccount && acc.manager && acc.balance > 0) {
    const pct = (Math.random() * 7 - 3) / 100; // -3% to +4%
    const change = acc.balance * pct;
    const before = acc.balance;
    acc.balance += change;
    acc.history.push(acc.balance);

    if (change > 0) {
      const ownerShare = change * 0.5;
      const managerShare = change * 0.5;
      const ownerFee = ownerShare * 0.15;
      const managerFee = managerShare * 0.15;
      const ownerNet = ownerShare - ownerFee;
      const managerNet = managerShare - managerFee;
      state.incomeStreams.managedPersonal += ownerNet;
      log(`Day ${state.day} trading. ${acc.manager.alias} made $${change.toFixed(2)} on the account. Split $${ownerShare.toFixed(2)} and $${managerShare.toFixed(2)}, TE takes 15 percent each. You net $${ownerNet.toFixed(2)}, manager nets $${managerNet.toFixed(2)}.`, "good");
    } else if (change < 0) {
      log(`Day ${state.day} trading. ${acc.manager.alias} lost $${Math.abs(change).toFixed(2)}. Balance now $${acc.balance.toFixed(2)} of $${acc.fundedValue.toFixed(2)} funded value.`, "bad");
    }

    // Hard stop check
    if (acc.balance <= acc.fundedValue * 0.5 && !state.restitution.inQueue && !state.socialBond.active) {
      const disconnected = acc.manager;
      acc.manager = null;
      const claim = acc.fundedValue - acc.balance;
      state.restitution.inQueue = true;
      state.restitution.claimAmount = claim;
      state.restitution.queuePosition = Math.floor(1000 + Math.random() * 20000);
      state.restitution.daysInQueue = 0;
      state.restitution.recoveredSoFar = 0;
      log(`Hard stop triggered. Account fell to 50 percent of funded value. ${disconnected.alias} disconnected at broker level. Claim of $${claim.toFixed(2)} timestamped, queue position #${state.restitution.queuePosition.toLocaleString()}.`, "bad");
    }
  }

  // Restitution recovery tick
  const rest = state.restitution;
  if (rest.inQueue) {
    rest.daysInQueue++;
    const recoveryChunk = rest.claimAmount * (0.1 + Math.random() * 0.15);
    rest.recoveredSoFar = Math.min(rest.claimAmount, rest.recoveredSoFar + recoveryChunk);
    state.account.balance += Math.min(recoveryChunk, rest.claimAmount - (rest.recoveredSoFar - recoveryChunk));

    if (rest.daysInQueue === 1) {
      log(`Restitution recovery started. Primary and secondary interception now pulling from the restored trader's future revenue and the defaulting manager's whole platform earnings.`, "");
    }

    if (rest.recoveredSoFar >= rest.claimAmount) {
      state.account.balance = state.account.fundedValue;
      rest.inQueue = false;
      log(`Restitution complete after ${rest.daysInQueue} simulated days. Account fully restored to $${state.account.fundedValue.toFixed(2)}. You can select a new manager.`, "good");
      rollTodaysManagers();
    } else if (rest.daysInQueue === 90) {
      log(`90 day threshold reached without full recovery from the manager's earnings. TE's restitution buffer now covers the remaining balance.`, "warn");
    }
  }

  // Social Bond lien countdown
  const sb = state.socialBond;
  if (sb.active) {
    sb.lienDaysLeft--;
    if (sb.lienDaysLeft <= 0) {
      sb.active = false;
      log(`Social Bond 30 day window closed. Lien settled from your own platform revenue first, per the repayment priority order.`, "");
    }
  }

  // Referral inactivity
  const ref = state.referral;
  if (ref.hasReferral) {
    ref.referrerInactiveDays++;
    if (ref.referrerInactiveDays === 45) {
      ref.marketplaceEligible = true;
      log(`Your referrer has been inactive 45 days. You are now eligible for the Referral Marketplace.`, "warn");
    }
  }

  // Background income streams, the 5 assigned accounts and referral overrides ticking in the background
  if (state.day % 3 === 0) {
    const assigned = Math.random() * 12 - 3;
    state.incomeStreams.assignedAccounts += assigned;
    const override = Math.random() * 4;
    state.incomeStreams.referralOverride += override;
  }
}

// ---------- RENDER ----------

const TABS = ["Overview", "Manager", "Capital Building", "Restitution", "Social Bond", "Referrals", "Revenue Streams"];
let activeTab = "Overview";

function switchTab(t) { activeTab = t; render(); }

function render() {
  document.getElementById("dayCount").textContent = state.day;
  renderTabs();
  renderContent();
  renderLog();
}

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.innerHTML = "";
  TABS.forEach(t => {
    const b = document.createElement("button");
    b.textContent = t;
    b.className = t === activeTab ? "active" : "";
    b.onclick = () => switchTab(t);
    nav.appendChild(b);
  });
}

function renderLog() {
  const box = document.getElementById("logBox");
  box.innerHTML = state.log.slice().reverse().map(e =>
    `<div class="entry ${e.cls}"><span class="day-tag">Day ${e.day}</span>${e.text}</div>`
  ).join("");
}

function renderContent() {
  const c = document.getElementById("content");
  if (activeTab === "Overview") return renderOverview(c);
  if (activeTab === "Manager") return renderManager(c);
  if (activeTab === "Capital Building") return renderCapitalBuilding(c);
  if (activeTab === "Restitution") return renderRestitution(c);
  if (activeTab === "Social Bond") return renderSocialBond(c);
  if (activeTab === "Referrals") return renderReferrals(c);
  if (activeTab === "Revenue Streams") return renderRevenueStreams(c);
}

function renderOverview(c) {
  const acc = state.account;
  c.innerHTML = `
    <div class="panel">
      <h2>Account overview</h2>
      <p class="desc">The full trader state, everything else in this prototype feeds into this.</p>
      <div class="stat-row"><span class="label">Has account</span><span class="value">${acc.hasAccount ? "Yes" : "Not yet"}</span></div>
      ${acc.hasAccount ? `
      <div class="stat-row"><span class="label">Funded value</span><span class="value">$${acc.fundedValue.toFixed(2)}</span></div>
      <div class="stat-row"><span class="label">Current balance</span><span class="value ${acc.balance >= acc.fundedValue ? "good" : "bad"}">$${acc.balance.toFixed(2)}</span></div>
      <div class="stat-row"><span class="label">Assigned manager</span><span class="value">${acc.manager ? acc.manager.alias + " (" + acc.manager.region + ")" : "None, pick one on the Manager tab"}</span></div>
      ` : `<div style="margin-top:12px;"><button onclick="startAccount()">Make a personal deposit to start</button></div>`}
      <div class="stat-row"><span class="label">In restitution queue</span><span class="value ${state.restitution.inQueue ? 'warn' : ''}">${state.restitution.inQueue ? "Yes, position #" + state.restitution.queuePosition.toLocaleString() : "No"}</span></div>
      <div class="stat-row"><span class="label">Social Bond active</span><span class="value">${state.socialBond.active ? state.socialBond.lienDaysLeft + " days left on lien" : "No"}</span></div>
      <div class="stat-row"><span class="label">Referral status</span><span class="value">${state.referral.marketplaceEligible ? "Eligible for marketplace" : "Referrer active"}</span></div>
    </div>
    <div class="panel">
      <h2>What this prototype shows</h2>
      <p class="desc">Use Advance day to move the whole simulation forward. Every system below reacts to the same clock, the way it would on the real platform.</p>
    </div>
  `;
}

function renderManager(c) {
  const acc = state.account;
  if (!acc.hasAccount) {
    c.innerHTML = `<div class="panel"><h2>Manager marketplace</h2><p class="desc">You need an active account first. Go to Overview and make a personal deposit, or fund one through Capital Building.</p></div>`;
    return;
  }
  if (state.todaysManagerOptions.length === 0) rollTodaysManagers();
  c.innerHTML = `
    <div class="panel">
      <h2>Today's three managers</h2>
      <p class="desc">One from each of three different regions. Rotating alias, blind assignment, no identity shown either way.</p>
      ${state.todaysManagerOptions.map(m => `
        <div class="manager-card ${acc.manager && acc.manager.id === m.id ? 'selected' : ''}">
          <div class="info">${m.alias}<div class="region">${m.region}</div></div>
          <button class="secondary" onclick="pickManager('${m.id}')">Assign</button>
        </div>
      `).join("")}
    </div>
    <div class="panel">
      <h2>Currently assigned</h2>
      <div class="stat-row"><span class="label">Manager</span><span class="value">${acc.manager ? acc.manager.alias : "None"}</span></div>
      <div class="stat-row"><span class="label">Region</span><span class="value">${acc.manager ? acc.manager.region : "-"}</span></div>
      <p class="desc" style="margin-top:10px;">Assignment holds until a drawdown event or a deliberate switch. Advance the day to let this manager trade.</p>
    </div>
  `;
}

function renderCapitalBuilding(c) {
  const cb = state.capitalBuilding;
  c.innerHTML = `
    <div class="panel">
      <h2>Capital Building</h2>
      <p class="desc">Pick a target size, then advance days to make the scheduled 1.1 percent daily payment automatically.</p>
      ${!cb.active ? `
        <div class="row-inline">
          <input type="number" id="cbTarget" value="10000" min="100" step="100">
          <button onclick="startCapitalBuilding(parseFloat(document.getElementById('cbTarget').value))">Start</button>
        </div>
      ` : `
        <div class="stat-row"><span class="label">Target</span><span class="value">$${cb.target.toLocaleString()}</span></div>
        <div class="stat-row"><span class="label">Day</span><span class="value">${cb.day} of 100</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${Math.min(100, cb.day)}%"></div></div>
        <div class="stat-row"><span class="label">Paid so far</span><span class="value">$${cb.paidSoFar.toFixed(2)}</span></div>
        <div class="stat-row"><span class="label">Status</span><span class="value ${cb.funded ? 'good' : ''}">${cb.funded ? "Funded" : "In progress"}</span></div>
      `}
    </div>
  `;
}

function renderRestitution(c) {
  const rest = state.restitution;
  c.innerHTML = `
    <div class="panel">
      <h2>Restitution</h2>
      <p class="desc">Triggers automatically when the account falls to 50 percent of funded value. Nothing to click here, advance the day and watch the account balance on Overview.</p>
      ${rest.inQueue ? `
        <div class="stat-row"><span class="label">Queue position</span><span class="value">#${rest.queuePosition.toLocaleString()}</span></div>
        <div class="stat-row"><span class="label">Claim amount</span><span class="value">$${rest.claimAmount.toFixed(2)}</span></div>
        <div class="stat-row"><span class="label">Recovered so far</span><span class="value good">$${rest.recoveredSoFar.toFixed(2)}</span></div>
        <div class="bar-bg"><div class="bar-fill" style="width:${(rest.recoveredSoFar / rest.claimAmount * 100).toFixed(0)}%"></div></div>
        <div class="stat-row"><span class="label">Days in queue</span><span class="value">${rest.daysInQueue}</span></div>
      ` : `<p class="desc">No active claim right now.</p>`}
    </div>
  `;
}

function renderSocialBond(c) {
  const sb = state.socialBond;
  const loss = state.account.hasAccount ? state.account.fundedValue - state.account.balance : 0;
  c.innerHTML = `
    <div class="panel">
      <h2>Social Bond</h2>
      <p class="desc">Skip the restitution wait by bonding against your remaining value. Only available while carrying a loss and not already bonded.</p>
      <div class="stat-row"><span class="label">Current loss</span><span class="value ${loss > 0 ? 'bad' : ''}">$${loss.toFixed(2)}</span></div>
      ${!sb.active ? `<div style="margin-top:10px;"><button onclick="requestSocialBond()" ${loss <= 0 ? 'disabled' : ''}>Request Social Bond</button></div>` : `
        <div class="stat-row"><span class="label">Bonded amount</span><span class="value">$${sb.amount.toFixed(2)}</span></div>
        <div class="stat-row"><span class="label">Facilitator covered</span><span class="value">$${sb.facilitatorCovered.toFixed(2)}</span></div>
        <div class="stat-row"><span class="label">Bonders covered</span><span class="value">$${sb.bonderCovered.toFixed(2)}</span></div>
        <div class="stat-row"><span class="label">Lien days left</span><span class="value warn">${sb.lienDaysLeft}</span></div>
      `}
    </div>
  `;
}

function renderReferrals(c) {
  const ref = state.referral;
  c.innerHTML = `
    <div class="panel">
      <h2>Referral status</h2>
      <div class="stat-row"><span class="label">Referrer</span><span class="value">${ref.referrerId}</span></div>
      <div class="stat-row"><span class="label">Referrer inactive days</span><span class="value">${ref.referrerInactiveDays}</span></div>
      <div class="stat-row"><span class="label">Marketplace eligible</span><span class="value ${ref.marketplaceEligible ? 'warn' : ''}">${ref.marketplaceEligible ? "Yes" : "Not yet, needs 45 days"}</span></div>
      ${ref.marketplaceEligible ? `
        <p class="desc" style="margin-top:10px;">Pick how much of the 15 percent you want to retain, up to 5 percent, the rest goes to your new referrer.</p>
        <div class="row-inline">
          <input type="range" id="retainSlider" min="0" max="5" value="5">
          <button onclick="joinReferralMarketplace(parseInt(document.getElementById('retainSlider').value))">Find new referrer</button>
        </div>
      ` : ""}
    </div>
  `;
}

function renderRevenueStreams(c) {
  const s = state.incomeStreams;
  const rows = [
    ["Managed personal equity", s.managedPersonal],
    ["Sub manager revenue spread", s.subManagerSpread],
    ["Direct account management", s.directManagement],
    ["Assigned account allocations, the 5 accounts", s.assignedAccounts],
    ["Sub manager performance cut", s.subManagerCut],
    ["Social Bond facilitator yield", s.facilitatorYield],
    ["Social Bond bonder pool yield", s.bonderYield],
    ["Referral network overrides", s.referralOverride],
    ["Capital Building maturities", s.capitalBuildingMaturity],
  ];
  const total = rows.reduce((sum, r) => sum + r[1], 0);
  c.innerHTML = `
    <div class="panel">
      <h2>Nine income streams</h2>
      <p class="desc">Simulated running totals across every stream a single trader can access on TE. Assigned accounts and referral overrides tick in the background as days pass, even without trading manually.</p>
      <table>
        <tr><th>Stream</th><th>Total</th></tr>
        ${rows.map(r => `<tr><td>${r[0]}</td><td class="${r[1] >= 0 ? 'good' : 'bad'}">$${r[1].toFixed(2)}</td></tr>`).join("")}
      </table>
      <div class="stat-row" style="margin-top:10px;"><span class="label">Combined total</span><span class="value ${total >= 0 ? 'good' : 'bad'}">$${total.toFixed(2)}</span></div>
    </div>
  `;
}

// ---------- INIT ----------
function resetSim() {
  state = freshState();
  log("Simulation reset. Day 0.", "");
  render();
}

resetSim();
</script>
</body>
</html>
